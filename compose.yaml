services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: party
      POSTGRES_USER: party
      POSTGRES_PASSWORD: local-development-only
    ports: ["15436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party -d party"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: ["party-postgres-data:/var/lib/postgresql/data"]
  migrate:
    build: .
    entrypoint: ["/party-migrate"]
    environment: &party-env
      PARTY_ENVIRONMENT: sandbox
      PARTY_DATABASE_URL: postgres://party:local-development-only@postgres:5432/party?sslmode=disable
      PARTY_IDENTIFIER_HMAC_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      PARTY_AUTH_DISABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
  party-api:
    build: .
    environment:
      <<: *party-env
      PARTY_HTTP_ADDRESS: :8080
    ports: ["18086:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  party-postgres-data:
